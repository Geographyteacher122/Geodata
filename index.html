<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>تطبيقات البيانات الجغرافية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Lalezar&display=swap">
<style>
:root{--cy:#00e5ff;--or:#ff7a1a;--pk:#ff3d81;--gr:#2bd67b;--rd:#ff4d5e;--nv:#060b2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e3c2;color:#0b2a4a;font-family:'Cairo','Segoe UI','Noto Sans Arabic','Geeza Pro',Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%}
.glass{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(205,140,60,.55);box-shadow:0 6px 22px rgba(150,90,30,.22);border-radius:18px}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));inset-inline:8px;display:none;z-index:5}
#hud.on{display:block}
.row{display:flex;gap:8px;align-items:stretch}
.stat{flex:1;padding:6px 12px;text-align:center;min-width:0}
.stat small{display:block;font-size:clamp(11px,1.5vw,14px);color:#9a6a38}
.stat b{font-size:clamp(20px,3.6vw,34px);font-weight:800;font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;font-size:.5em;color:#9a6a38;margin-inline-start:4px}
.pop{animation:pop .4s}#qn{direction:ltr;unicode-bidi:isolate;display:block}
@keyframes pop{40%{transform:scale(1.25);color:var(--or)}}
#mute{flex:0 0 58px;font-size:26px;background:rgba(255,255,255,.88);color:#0b2a4a;cursor:pointer;padding:0}
#mute:active{transform:scale(.92)}
#track{position:relative;height:14px;margin:12px 22px 0;background:rgba(150,90,30,.22);border-radius:9px;direction:rtl}
#fill{position:absolute;inset-block:0;right:0;width:0;border-radius:9px;background:linear-gradient(270deg,#ff8a3d,#ffc83d);box-shadow:0 0 10px rgba(255,160,50,.6);transition:width .9s cubic-bezier(.2,.8,.2,1)}
#fill::after{content:'🏎️';position:absolute;left:-16px;top:-13px;font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.cp{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #e08a2e;transform:translate(50%,-50%);font-size:11px;line-height:14px;text-align:center;transition:.4s}
.cp.on{background:var(--gr);border-color:#fff;box-shadow:0 0 10px var(--gr)}
#fb{position:fixed;top:23%;left:0;right:0;text-align:center;font-size:clamp(28px,7vw,64px);font-weight:900;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 #fff,0 0 20px rgba(255,255,255,.95)}
#fb.ok{color:#0f9d58}#fb.bad{color:#e03a4e}
#fb.go{animation:fb 1.5s}
@keyframes fb{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#fb small{display:block;font-size:.42em;font-weight:700;color:#0b2a4a}
#combo{position:fixed;top:34%;left:0;right:0;text-align:center;font-size:clamp(30px,8vw,76px);font-weight:900;font-style:italic;letter-spacing:2px;color:#ff8a00;pointer-events:none;z-index:6;opacity:0;text-shadow:0 3px 0 #fff,0 0 22px rgba(255,255,255,.95);direction:ltr}
#combo.go{animation:cmb 1.4s}
@keyframes cmb{0%{opacity:0;transform:translateX(-120px) skewX(-14deg) scale(.6)}18%{opacity:1;transform:translateX(0) skewX(-8deg) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateX(90px) skewX(-8deg)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(circle,transparent 40%,rgba(255,200,60,.5));}
#flash.go{animation:fl .8s}#flash.bad{background:radial-gradient(circle,transparent 45%,rgba(255,90,100,.4))}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#qcard{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;width:min(1000px,96vw);transform:translate(-50%,130%);padding:12px;display:flex;gap:14px;align-items:center;z-index:5;transition:transform .55s cubic-bezier(.2,.9,.2,1)}
#qcard.on{transform:translate(-50%,0)}
.qimg{height:min(31vh,270px);max-width:38%;object-fit:contain;border-radius:12px;border:2px solid var(--cy);background:#fff;flex:none}
.qmain{flex:1;min-width:0}
.qtxt{font-size:clamp(17px,2.7vw,28px);font-weight:800;line-height:1.5;margin:2px 4px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:clamp(52px,8vh,74px);padding:8px 12px;border-radius:14px;border:2px solid #e9c08a;background:linear-gradient(180deg,#ffffff,#fff4e0);color:#0b2a4a;font:inherit;font-size:clamp(15px,2.3vw,24px);font-weight:700;text-align:start;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.opt b{flex:none;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;background:#2f86e8;color:#fff;font-size:.85em}
.opt:hover{transform:translateY(-2px);border-color:#e08a2e;box-shadow:0 6px 16px rgba(224,138,46,.35)}.opt:nth-child(2) b{background:#f5b700;color:#4a3300}.opt:nth-child(3) b{background:#ff8a3d}.opt:nth-child(4) b{background:#2bc48a}
.opt:active{transform:scale(.96)}
.opt.ok{background:linear-gradient(180deg,#7be8b1,#35c07c);border-color:#12874f;color:#053a20;box-shadow:0 0 20px rgba(43,214,123,.6);animation:pop .5s}
.opt.ok b{background:#fff;color:#12874f}
.opt.no{background:linear-gradient(180deg,#ffc2c8,#ff8a96);border-color:#d8384c;color:#5a0a16;animation:shk .4s}
.opt.dim{opacity:.5}.opt[disabled]{pointer-events:none}
@keyframes shk{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.scr{position:fixed;inset:0;display:none;background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.72),rgba(255,255,255,.1) 72%);flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,20px);text-align:center;padding:16px 16px 20vh;z-index:7;overflow-y:auto}
.scr.on{display:flex}
h1{margin:0;font-size:clamp(18px,5.8vw,92px);white-space:nowrap;line-height:1.25;font-weight:900;background:linear-gradient(180deg,#14a6dc 15%,#1766c4 60%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #fff) drop-shadow(0 8px 14px rgba(20,100,170,.35));animation:tt 3.5s ease-in-out infinite}
@keyframes tt{50%{transform:translateY(-6px) scale(1.015)}}
.tag{font-size:clamp(16px,3vw,30px);font-weight:700;color:#0b4a7a;text-shadow:0 2px 0 #fff}
.chips{display:flex;gap:clamp(8px,2vw,18px);font-size:clamp(28px,5vw,52px);filter:drop-shadow(0 4px 6px rgba(20,100,170,.3))}
.chips span{animation:fl2 3s ease-in-out infinite}
.chips span:nth-child(2n){animation-delay:.5s}.chips span:nth-child(3n){animation-delay:1s}
@keyframes fl2{50%{transform:translateY(-9px)}}
.btn{border:0;cursor:pointer;font:inherit;font-weight:900;font-size:clamp(22px,4vw,40px);color:#fff;padding:.5em 1.7em;border-radius:999px;background:linear-gradient(180deg,#ff9a3c,var(--or) 50%,#e5470b);box-shadow:0 8px 0 #c4500d,0 10px 24px rgba(255,122,26,.45);transition:transform .12s,box-shadow .12s;animation:pl 1.6s infinite}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #c4500d,0 4px 12px rgba(255,122,26,.4)}
.btn.sec{background:linear-gradient(180deg,#4aa3f0,#2670d0);box-shadow:0 8px 0 #164a96,0 10px 20px rgba(38,112,208,.35);font-size:clamp(18px,3vw,30px);animation:none}
@keyframes pl{50%{transform:scale(1.045)}}
.best{font-size:clamp(14px,2.2vw,20px);color:#b86e00;font-weight:800}
.credit{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));left:0;right:0;font-size:clamp(14px,2.4vw,22px);font-weight:800;color:#0b4a7a;text-shadow:0 1px 0 #fff}
#cd{position:fixed;inset:0;display:none;place-items:center;font-size:clamp(90px,26vw,280px);font-weight:900;font-style:italic;z-index:8;pointer-events:none;color:#ff8a00;text-shadow:0 8px 0 #fff,0 0 40px rgba(255,255,255,.95);direction:ltr}
#cd.on{display:grid}
#cd.pop2{animation:cd .9s}
@keyframes cd{0%{transform:scale(2.4);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.7);opacity:0}}
#medal{font-size:clamp(70px,16vw,140px);animation:bn 1.2s infinite;filter:drop-shadow(0 0 24px #ffd23f)}
@keyframes bn{50%{transform:translateY(-14px) rotate(-4deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(820px,94vw)}
.stats div{padding:10px 6px}.stats small{display:block;color:#9a6a38;font-size:clamp(12px,1.8vw,17px)}
.stats b{font-size:clamp(24px,5vw,46px);font-weight:900}
.btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
@media(max-width:640px){#qcard{flex-direction:column;gap:8px}.qimg{height:17vh;max-width:100%}.opts{grid-template-columns:1fr}.opt{min-height:44px}.qtxt{margin-bottom:6px}.stats{grid-template-columns:1fr 1fr}.scr{padding-bottom:12vh}}
@media(prefers-reduced-motion:reduce){h1,.btn,.chips span,#medal{animation:none}}
h1,.btn,#fb,#combo,#cd,.stat b,.stats b{font-family:'Lalezar','Cairo','Segoe UI',sans-serif;font-weight:400;letter-spacing:.3px}
#fb small{font-family:'Cairo','Segoe UI',sans-serif;font-weight:800}
.qtxt,.opt{font-family:'Cairo','Segoe UI',sans-serif}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="row">
    <div class="stat glass"><small>النقاط</small><b id="sc">0</b></div>
    <div class="stat glass"><small>السرعة</small><b><span id="sp">0</span><i>كم/س</i></b></div>
    <div class="stat glass"><small>السؤال</small><b id="qn">1 / 5</b></div>
    <button id="mute" class="glass" aria-label="الصوت">🔊</button>
  </div>
  <div id="track"><div id="fill"></div></div>
</div>
<div id="fb"></div><div id="combo"></div><div id="flash"></div>
<div id="qcard" class="glass"></div>
<div id="cd"></div>

<section id="start" class="scr on">
  <div class="chips"><span>🏎️</span><span>🗺️</span><span>📍</span><span>🛰️</span><span>⚡</span><span>🏁</span></div>
  <h1>تطبيقات البيانات الجغرافية</h1>
  <button class="btn" id="go">ابدأ اللعبة</button>
  <div class="best" id="best0"></div>
  <div class="credit">إعداد: أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي <bdi>(1-9)</bdi></div>
</section>

<section id="end" class="scr">
  <div id="medal">🏆</div>
  <h1 style="font-size:clamp(34px,8vw,72px)">انتهت اللعبة! 🏁</h1>
  <div class="stats">
    <div class="glass"><small>النقاط</small><b id="e1">0</b></div>
    <div class="glass"><small>الإجابات الصحيحة</small><b id="e2">0</b></div>
    <div class="glass"><small>الإجابات الخاطئة</small><b id="e3">0</b></div>
    <div class="glass"><small>نسبة الأداء</small><b id="e4">0%</b></div>
  </div>
  <div class="best" id="best1"></div>
  <div class="btns"><button class="btn" id="again">إعادة اللعبة</button><button class="btn sec" id="home">العودة للبداية</button></div>
  <div class="credit">إعداد: أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي <bdi>(1-9)</bdi></div>
</section>

function tone(f, d, ty = 'sine', v = .07, at = 0, f2) {
  if (muted || !AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + at;

}

const G = { mode: 'idle', dist: 0, speed: 60, cruise: 80, boostT: 0, slowT: 0, shake: 0, score: 0, shown: 0, streak: 0, right: 0, wrong: 0, idx: 0, order: [], locked: false, carY: .8, conf: [], tok: 0 };

function buildTrack() {
  $('#fill').style.width = '0';
  [...document.querySelectorAll('.cp')].forEach(e => e.remove());
  for (let i = 0; i < N; i++) { const c = document.createElement('span'); c.className = 'cp'; c.style.right = ((i + 1) / N * 100) + '%'; c.textContent = i === N - 1 ? '🏁' : '📍'; $('#track').appendChild(c); }
}

  $('#qn').textContent = Math.min(G.idx + 1, N) + ' / ' + N;

function makeOrder() {
  const fixed = QUESTIONS.filter(q => q.pos), free = shuffle(QUESTIONS.filter(q => !q.pos));

$('#go').onclick = begin; $('#again').onclick = begin; $('#home').onclick = () => { sfx('click'); goHome(); };
$('#best0').textContent = getBest() ? 'أعلى نتيجة: ' + getBest() + ' نقطة' : '';

/* ---------- الرسم: مضمار شبه ثلاثي الأبعاد ---------- */
const stars = Array.from({ length: 50 }, (_, i) => [(i * 137.5) % 100, (i * 53.3) % 100, i % 4]);
const bld = Array.from({ length: 34 }, (_, i) => [i / 34, 20 + ((i * 47) % 60), .022 + ((i * 13) % 10) / 500]);
const PROPS = ['🌴', '📍', '🌴', '🌵', '🐪', '🌴'];
function roadAt(p, cu) { const o = 1 - p; return { cx: W / 2 + cu * W * .9 * o * o, hw: W * .015 + W * .43 * p }; }

function drawCar(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,50,90,.28)'; ctx.beginPath(); ctx.ellipse(0, 56, 105, 14, 0, 0, 6.3); ctx.fill();
  const gl = ctx.createRadialGradient(0, 50, 5, 0, 50, 120); gl.addColorStop(0, 'rgba(255,200,60,.45)'); gl.addColorStop(1, 'rgba(255,200,60,0)');
  ctx.fillStyle = gl; ctx.fillRect(-130, 0, 260, 110);
  if (G.boostT > 0) { const fl = 30 + Math.random() * 30; [-42, 42].forEach(dx => { ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.moveTo(dx - 12, 34); ctx.lineTo(dx, 34 + fl + 20); ctx.lineTo(dx + 12, 34); ctx.fill(); ctx.fillStyle = '#ffe98a'; ctx.beginPath(); ctx.moveTo(dx - 6, 34); ctx.lineTo(dx, 34 + fl); ctx.lineTo(dx + 6, 34); ctx.fill(); }); }
  ctx.fillStyle = '#0c0c14';[-100, 66].forEach(wx => { ctx.beginPath(); ctx.roundRect(wx, 6, 34, 62, 8); ctx.fill(); });
  let g = ctx.createLinearGradient(0, -40, 0, 46); g.addColorStop(0, '#4a9bf0'); g.addColorStop(1, '#1c4fa8');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-84, -32, 168, 78, 24); ctx.fill();
  ctx.fillStyle = '#173a7a'; ctx.beginPath(); ctx.moveTo(-58, -30); ctx.lineTo(-42, -74); ctx.lineTo(42, -74); ctx.lineTo(58, -30); ctx.fill();
  g = ctx.createLinearGradient(0, -70, 0, -34); g.addColorStop(0, '#bff0ff'); g.addColorStop(1, '#3a86b8');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-47, -34); ctx.lineTo(-35, -66); ctx.lineTo(35, -66); ctx.lineTo(47, -34); ctx.fill();
  ctx.fillStyle = '#ffc21a'; ctx.fillRect(-96, -52, 192, 11); ctx.fillRect(-70, -44, 9, 14); ctx.fillRect(61, -44, 9, 14);
  ctx.fillStyle = '#fff'; ctx.fillRect(-4, -84, 8, 0);
  ctx.shadowColor = '#ff2a4d'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff2a4d';
  ctx.beginPath(); ctx.roundRect(-76, -6, 42, 15, 5); ctx.fill(); ctx.beginPath(); ctx.roundRect(34, -6, 42, 15, 5); ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#f4f7ff'; ctx.beginPath(); ctx.roundRect(-24, 14, 48, 18, 4); ctx.fill();
  ctx.fillStyle = '#0a1a55'; ctx.font = '800 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GIS', 0, 28);
  ctx.restore();
}

function frame(t) {
  const dt = Math.min(.05, (t - (frame.l || t)) / 1000); frame.l = t;
  G.boostT = Math.max(0, G.boostT - dt); G.slowT = Math.max(0, G.slowT - dt); G.shake = Math.max(0, G.shake - dt * 1.4);
  const tgt = G.boostT > 0 ? 250 : G.slowT > 0 ? 55 : G.cruise;
  G.speed += (tgt - G.speed) * Math.min(1, dt * 3); G.dist += G.speed * 3 * dt;
  const portrait = H > W * 1.15, carTarget = G.mode === 'idle' || G.mode === 'end' ? .8 : portrait ? .32 : .4;
  G.carY += (carTarget - G.carY) * Math.min(1, dt * 3);
  $('#sp').textContent = Math.round(G.speed);
  if (G.shown !== G.score) { G.shown += Math.sign(G.score - G.shown) * Math.max(1, Math.ceil(Math.abs(G.score - G.shown) * dt * 6)); if (Math.abs(G.score - G.shown) < 2) G.shown = G.score; $('#sc').textContent = G.shown; retrigger($('#sc'), 'pop'); }

  const hor = H * .3, RH = H - hor, cu = Math.sin(G.dist / 2200) * .55 + Math.sin(G.dist / 900) * .2;
  let g = ctx.createLinearGradient(0, 0, 0, hor); g.addColorStop(0, '#5fb8ee'); g.addColorStop(.6, '#b9e0f6'); g.addColorStop(1, '#f8dca8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, hor + 2);
  stars.forEach((s, i) => { if (i % 5) return; const cw = W * 1.4, cx = (((s[0] / 100 * cw - t * .012 * (1 + s[2])) % cw) + cw) % cw - W * .2, cy = s[1] / 100 * hor * .75, r = (16 + s[2] * 7) * H / 700; ctx.globalAlpha = .7; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx, cy, r * 2, r * .7, 0, 0, 6.3); ctx.ellipse(cx + r, cy - r * .4, r * 1.1, r * .7, 0, 0, 6.3); ctx.fill(); });
  ctx.globalAlpha = 1;
  const sr = H * .11, sg = ctx.createLinearGradient(0, hor - sr * 2, 0, hor); sg.addColorStop(0, '#ffe27a'); sg.addColorStop(1, '#ffb347');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W * .5 - cu * W * .08, hor - sr * .3, sr, Math.PI, 0); ctx.fill();
  ctx.font = Math.max(22, H * .05) + 'px serif'; ctx.textAlign = 'center';
  ctx.fillText('🛰️', W - ((t * .03) % (W + 140)) + 40, H * .1 + Math.sin(t / 900) * 8);
  const off = -cu * W * .12;
  ctx.fillStyle = '#ecc590'; ctx.beginPath(); ctx.moveTo(0, hor);
  for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, hor - (22 + 16 * Math.sin(x * .008 + off * .01) + 10 * Math.sin(x * .021)) * H / 600);
  ctx.lineTo(W, hor); ctx.fill();
  bld.forEach((b, i) => {
    const bw = W * b[2] * 1.6, bh = b[1] * H / 640, bx = b[0] * W * 1.1 - W * .05 + off;
    ctx.fillStyle = i % 2 ? '#d9a468' : '#e2b179'; ctx.fillRect(bx, hor - bh, bw, bh);
    ctx.fillStyle = '#c28a50'; ctx.fillRect(bx, hor - bh, bw, Math.max(2, bh * .08));
    if (i % 4 === 1) { const tw = bw * .38; ctx.fillStyle = '#cf9858'; ctx.fillRect(bx + bw * .3, hor - bh * 1.55, tw, bh * .55); ctx.fillStyle = '#8f5d30'; ctx.fillRect(bx + bw * .3 + tw * .2, hor - bh * 1.45, tw * .2, bh * .2); ctx.fillRect(bx + bw * .3 + tw * .6, hor - bh * 1.45, tw * .2, bh * .2); }
    ctx.fillStyle = '#8f5d30'; ctx.fillRect(bx + bw * .2, hor - bh * .6, bw * .18, bh * .2);
    if (i % 5 === 2) { ctx.font = H * .07 + 'px serif'; ctx.textAlign = 'center'; ctx.fillText('🌴', bx + bw, hor + 2); }
  });
  ctx.fillStyle = '#d9a66a'; ctx.fillRect(0, hor - 1, W, 2);

  for (let y = Math.floor(hor); y < H; y += 2) { const p = (y - hor + 1) / RH, z = FOC * (1 / p - 1), s = Math.floor((z + G.dist) / 110) & 1; ctx.fillStyle = s ? '#e3b574' : '#ebc283'; ctx.fillRect(0, y, W, 3); }
  ctx.strokeStyle = 'rgba(150,95,40,.16)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = -12; i <= 12; i++) { ctx.moveTo(W / 2 + i * W * .3, H); ctx.lineTo(W / 2 + i * W * .02 + cu * W * .9, hor); } ctx.stroke();
  for (let y = Math.floor(hor); y < H; y += 2) {
    const p = (y - hor + 1) / RH, z = FOC * (1 / p - 1), d = z + G.dist, s = Math.floor(d / 110) & 1, r = roadAt(p, cu), cb = r.hw * .09;
    ctx.fillStyle = s ? '#f6f0e6' : '#d8332c'; ctx.fillRect(r.cx - r.hw - cb, y, cb, 3); ctx.fillRect(r.cx + r.hw, y, cb, 3);
    ctx.fillStyle = s ? '#cf9c68' : '#c79360'; ctx.fillRect(r.cx - r.hw, y, r.hw * 2, 3);
    ctx.fillStyle = 'rgba(110,65,30,.35)'; ctx.fillRect(r.cx - r.hw, y, r.hw * .02, 3); ctx.fillRect(r.cx + r.hw * .98, y, r.hw * .02, 3);
    if (s) { ctx.fillStyle = '#ffffff'; ctx.fillRect(r.cx - r.hw * .012, y, r.hw * .024, 3); }
    if (d % 1400 < 90) { ctx.fillStyle = (Math.floor(d / 16) & 1) ? '#2f86e8' : '#1d5fc4'; ctx.fillRect(r.cx - r.hw * .55, y, r.hw * 1.1, 3); }
  }
  const far = 7000, k0 = Math.ceil(G.dist / 350), k1 = Math.floor((G.dist + far) / 350);
  for (let k = k1; k >= k0; k--) {
    const d = k * 350, z = d - G.dist; if (z <= 5) continue;
    const p = FOC / (z + FOC), y = hor + RH * p, r = roadAt((y - hor) / RH, cu);
    if (k % 4 === 0) {
      const ph = 300 * p, x1 = r.cx - r.hw * 1.12, x2 = r.cx + r.hw * 1.12, tw = Math.max(2, 14 * p);
      ctx.fillStyle = '#8a5530'; ctx.fillRect(x1 - tw, y - ph, tw, ph); ctx.fillRect(x2, y - ph, tw, ph);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x1 - tw, y - ph - 46 * p, x2 - x1 + tw * 2, 46 * p);
      ctx.shadowColor = '#ffb020'; ctx.shadowBlur = 14 * p; ctx.fillStyle = '#ffb020'; ctx.fillRect(x1 - tw, y - ph - 4 * p, x2 - x1 + tw * 2, Math.max(2, 5 * p)); ctx.shadowBlur = 0;
      ctx.fillStyle = '#7a3d12'; ctx.font = '800 ' + Math.max(8, 30 * p) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GPS • ' + (k / 4), r.cx, y - ph - 14 * p);
    } else {
      const side = k % 2 ? 1 : -1; ctx.font = Math.max(10, 190 * p) + 'px serif'; ctx.textAlign = 'center';
      ctx.fillText(PROPS[k % PROPS.length], r.cx + side * r.hw * 1.5, y - 14 * p);
    }
  }
  if (G.speed > 105) {
    ctx.strokeStyle = `rgba(255,248,235,${Math.min(.55, (G.speed - 105) / 260)})`; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 34; i++) { const a = i * 2.399, ph = (t / 1000 * (G.speed / 90) + i * .137) % 1, r1 = W * .16 + ph * ph * W * .8, r2 = r1 + W * .04 + ph * W * .22; ctx.moveTo(W / 2 + Math.cos(a) * r1, hor + RH * .3 + Math.sin(a) * r1 * .6); ctx.lineTo(W / 2 + Math.cos(a) * r2, hor + RH * .3 + Math.sin(a) * r2 * .6); }
    ctx.stroke();
  }
  const cy = H * G.carY, pc = Math.max(.02, (cy - hor) / RH), rc = roadAt(pc, cu), s = Math.min(W / 560, H / 650, 1.25) * .72 * (1 + (G.boostT > 0 ? .06 * Math.sin(t / 50) : 0));
  drawCar(rc.cx + Math.sin(t / 900) * 6 + (G.shake ? (Math.random() - .5) * 16 * G.shake : 0), cy + (G.speed > 60 ? Math.sin(t / 60) * 1.2 : 0), s, t);
  if (G.boostT > 0) { const bg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .9); bg.addColorStop(0, 'rgba(255,215,90,0)'); bg.addColorStop(1, `rgba(255,215,90,${Math.min(.3, G.boostT * .25)})`); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); }
  G.conf.forEach(c => { c.x += c.vx * dt; c.y += c.vy * dt; c.r += dt * 5; if (c.y > H + 20) { c.y = -20; c.x = Math.random() * W; } ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
